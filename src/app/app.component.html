<header class="topbar">
  <a routerLink="/" class="brand">
    <img src="img/tastevin-small.webp" width="54" height="24" alt="" />Tastevin
  </a>
  <span class="sub">v{{ info.version }} · {{ info.compileDate | date: 'dd/MM/yyyy' }} · {{ info.author }}</span>
</header>

<main class="content">
  <router-outlet />
</main>

<nav class="bottomnav" aria-label="Navigazione principale">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <i class="pi pi-home"></i><span>Home</span>
  </a>
  <a routerLink="/degustazione" routerLinkActive="active">
    <i class="pi pi-pen-to-square"></i><span>Degustazione</span>
  </a>
  <a routerLink="/archivio" routerLinkActive="active">
    <i class="pi pi-book"></i><span>Archivio</span>
  </a>
</nav>

<p-toast position="top-center" [breakpoints]="{ '640px': { width: '92vw', left: '4vw', right: '4vw' } }" />
<p-confirmdialog [style]="{ width: '22rem', maxWidth: '92vw' }" />
